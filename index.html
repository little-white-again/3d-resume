<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>凌博文 · 3D 作品空间站</title>
  <meta name="description" content="凌博文（little-white-again）的 3D 交互简历。" />
  <!-- 艺术字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/index-D4NWL3kf.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BxFQVm6l.css">
</head>
<body>
  <!-- 3D 场景 -->
  <div id="scene-container"></div>

  <!-- 鼠标像素轨迹（React Bits PixelTrail 效果） -->
  <canvas id="pixel-trail"></canvas>

  <!-- 点击火花（React Bits ClickSpark 效果） -->
  <canvas id="click-spark"></canvas>

  <!-- 加载遮罩 -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-ring"></div>
      <p class="loader-text">ENTERING SPACE<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-left"><span class="hud-dot"></span><span class="hud-text">SYSTEM ONLINE</span></div>
    <div class="hud-center">L.B.W <span class="hud-divider">//</span> PORTFOLIO_3D</div>
    <div class="hud-right"><span class="hud-coord" id="hud-coord">X:0 Y:0 Z:0</span></div>
  </div>

  <!-- 顶部 Hero（缩小） -->
  <header id="hero">
    <div class="hero-eyebrow">WELCOME TO MY PORTFOLIO</div>
    <h1 class="hero-title">
      <span class="hero-title-cn" id="scramble-text">凌博文</span>
      <span class="hero-title-en">LING BOWEN</span>
    </h1>
    <div class="hero-meta">
      <span class="hero-sub">江苏理工学院 · 准大一</span>
      <span class="hero-sep">/</span>
      <span class="hero-sub rotating-text" id="rotating-text">Vibe Coding 创作者</span>
    </div>
  </header>

  <!-- 底部提示 -->
  <div id="bottom-hint">
    <span>◈ 点击星球查看全部信息 ◈</span>
  </div>

  <!-- 内容弹窗（高科技毛玻璃） -->
  <div id="content-modal">
    <div class="modal-frame">
      <div class="modal-glow"></div>
      <button id="modal-close" class="modal-close">×</button>
      <div class="modal-scroll">
        <div class="modal-header">
          <div class="modal-badge" id="modal-badge">MODULE DATA</div>
          <h2 id="modal-title"></h2>
          <p id="modal-org" class="modal-org"></p>
          <div id="modal-tags" class="modal-tags"></div>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-links" class="modal-links"></div>
      </div>
    </div>
  </div>

</body>
</html>
